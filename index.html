<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wake — Position at Sea</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  :root{
    --ground:#04070C;
    --panel:rgba(7,15,25,.80);
    --panel-solid:#0A1522;
    --edge:#1B3247;
    --edge-hi:#2C4E6E;
    --ink:#D6E4F0;
    --muted:#5E7A94;
    --cyan:#4FD8FF;
    --cyan-dim:rgba(79,216,255,.35);
    --amber:#FFB454;
    --good:#4FE0A3;
    --bad:#F06A6A;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --hud:'Rajdhani','Archivo Narrow',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ground);color:var(--ink);
    font-family:var(--hud);overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #map{position:fixed;inset:0;background:var(--ground)}
  .maplibregl-ctrl-attrib{background:rgba(7,15,25,.6)!important;font-family:var(--mono);font-size:9px}
  .maplibregl-ctrl-attrib a{color:var(--muted)!important}

  /* ---- HUD frame ---- */
  .corner{position:fixed;width:26px;height:26px;z-index:6;pointer-events:none;
    border:1.5px solid var(--cyan-dim)}
  #c-tl{top:calc(58px + env(safe-area-inset-top,0px));left:10px;border-right:none;border-bottom:none}
  #c-tr{top:calc(58px + env(safe-area-inset-top,0px));right:10px;border-left:none;border-bottom:none}

  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:7;
    display:flex;align-items:center;gap:14px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--edge);
  }
  #topbar .name{font-weight:700;letter-spacing:.22em;font-size:16px}
  #topbar .name b{color:var(--cyan);font-weight:700}
  .stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);
    font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .stat:first-of-type{margin-left:auto}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--good);box-shadow:0 0 7px var(--good)}
  .dot.err{background:var(--bad)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .dot.wait{background:var(--amber);animation:pulse 1.2s ease-in-out infinite}

  /* ---- controls ---- */
  #controls{position:fixed;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));
    z-index:6;display:flex;flex-direction:column;gap:8px}
  .ctl{width:46px;height:46px;border-radius:8px;
    background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--edge);color:var(--ink);
    font-family:var(--mono);font-size:20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ctl:active{background:var(--edge)}
  .ctl.on{color:var(--cyan);border-color:var(--cyan-dim);box-shadow:0 0 12px rgba(79,216,255,.15)}
  .ctl:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .ctl .t{font-family:var(--hud);font-weight:700;font-size:13px;letter-spacing:.08em}

  /* ---- instrument deck ---- */
  #deck{
    position:fixed;left:0;right:0;bottom:0;z-index:7;
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--edge);
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 14px;
    padding:12px 16px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  }
  .inst{min-width:0}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin-bottom:1px;white-space:nowrap}
  .val{font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:23px;font-weight:600;line-height:1.15;white-space:nowrap}
  .unit{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
  .wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
  .wide .val{font-size:13px;font-weight:500}
  .stampt{font-family:var(--mono);font-size:10px;color:var(--muted)}

  /* ---- position marker ---- */
  .shipmark{width:0;height:0;position:relative}
  .shipmark .ring{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;
    border:1.5px solid var(--cyan);opacity:0;animation:ping 2.4s ease-out infinite}
  @keyframes ping{0%{transform:scale(.25);opacity:.9}70%{opacity:0}100%{transform:scale(1);opacity:0}}
  .shipmark .core{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;
    background:var(--cyan);border:2.5px solid #04121C;box-shadow:0 0 14px var(--cyan)}
  .shipmark .hdg{position:absolute;left:-10px;top:-30px;width:20px;height:20px;display:none}
  @media (prefers-reduced-motion: reduce){.shipmark .ring{animation:none}.dot.wait{animation:none}}

  /* ---- start overlay & banner ---- */
  #startov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:rgba(4,7,12,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #startov .brand{font-weight:700;letter-spacing:.3em;font-size:22px;color:var(--ink)}
  #startov .brand b{color:var(--cyan)}
  #startbtn{font-family:var(--hud);font-weight:700;letter-spacing:.15em;font-size:16px;
    color:#03121B;background:var(--cyan);border:none;border-radius:10px;
    padding:17px 30px;cursor:pointer;box-shadow:0 0 30px rgba(79,216,255,.35)}
  #startov .note{font-family:var(--mono);font-size:11px;color:var(--muted)}
  #banner{position:fixed;left:12px;right:70px;bottom:calc(150px + env(safe-area-inset-bottom,0px));
    z-index:6;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--edge);border-radius:8px;
    padding:11px 13px;font-family:var(--hud);font-size:14px;line-height:1.45;color:var(--muted);display:none}
  #banner b{color:var(--ink);font-weight:600}
  #banner a{color:var(--cyan);cursor:pointer;text-decoration:underline}
  #banner.show{display:block}

  /* ---- start choices & key sheet ---- */
  #startbtn2{font-family:var(--hud);font-weight:600;letter-spacing:.12em;font-size:13px;
    color:var(--ink);background:transparent;border:1px solid var(--edge-hi);border-radius:10px;
    padding:13px 22px;cursor:pointer}
  #keysheet{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;
    background:rgba(4,7,12,.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #keysheet.show{display:flex}
  #keysheet .kbox{width:min(420px,100%);background:var(--panel-solid);border:1px solid var(--edge);
    border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
  #keysheet h2{font-size:16px;font-weight:700;letter-spacing:.12em}
  #keysheet p{font-size:13px;line-height:1.5;color:var(--muted)}
  #keysheet p a{color:var(--cyan)}
  #aiskey{font-family:var(--mono);font-size:14px;color:var(--ink);background:#04101B;
    border:1px solid var(--edge-hi);border-radius:8px;padding:12px;width:100%}
  #keysheet .row{display:flex;gap:10px}
  #keysave{flex:1;font-family:var(--hud);font-weight:700;letter-spacing:.1em;font-size:14px;
    color:#03121B;background:var(--cyan);border:none;border-radius:8px;padding:13px;cursor:pointer}
  #sheet{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:25;display:none;
    max-height:72%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--panel-solid);border-top:1px solid var(--edge-hi);
    border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  #sheet.show{display:block}
  #sheet h2{font-size:14px;font-weight:700;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
  #sheet h2 span{color:var(--cyan)}
  .port{display:grid;grid-template-columns:12px 1fr;gap:0 12px;padding:10px 0;border-bottom:1px solid var(--edge)}
  .port:last-child{border-bottom:none}
  .pdot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);margin-top:4px}
  .port.done .pdot{background:var(--muted);border-color:var(--muted);opacity:.5}
  .port.now .pdot{background:var(--good);border-color:var(--good);box-shadow:0 0 8px var(--good)}
  .port.next .pdot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px var(--amber)}
  .pname{font-weight:700;font-size:15px;letter-spacing:.04em}
  .port.done .pname{color:var(--muted)}
  .pwhen{font-family:var(--mono);font-size:11px;color:var(--muted);margin:1px 0 3px}
  .pwhen b{color:var(--amber);font-weight:600}
  .port.now .pwhen b{color:var(--good)}
  .pplan{font-size:13px;line-height:1.45;color:var(--ink)}
  .ptip{font-size:12px;line-height:1.45;color:var(--muted);margin-top:2px}
  .portmark{transform:translate(-50%,-50%);font-family:var(--mono);font-size:9px;letter-spacing:.06em;
    color:var(--ink);background:rgba(7,15,25,.75);border:1px solid var(--edge-hi);
    border-radius:4px;padding:2px 5px;white-space:nowrap;pointer-events:none}
  .portmark.done{opacity:.45}
  #keycancel{font-family:var(--hud);font-weight:600;font-size:14px;color:var(--muted);
    background:none;border:1px solid var(--edge);border-radius:8px;padding:13px 18px;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div class="corner" id="c-tl"></div>
<div class="corner" id="c-tr"></div>

<div id="topbar">
  <div class="name">WAKE<b>//</b>SEA</div>
  <div class="stat"><span id="srctxt" style="color:var(--cyan)"></span></div>
  <div class="stat"><div class="dot wait" id="gpsdot"></div><span id="gpstxt">gps</span></div>
  <div class="stat"><div class="dot" id="netdot"></div><span id="nettxt">link</span></div>
</div>

<div id="controls">
  <button class="ctl" id="zin" aria-label="Zoom in">+</button>
  <button class="ctl" id="zout" aria-label="Zoom out">&minus;</button>
  <button class="ctl" id="tilt" aria-label="Toggle 3D view"><span class="t">3D</span></button>
  <button class="ctl" id="shipbtn" aria-label="Track ship via AIS">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="4.5" r="2.4" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 7v9M6.5 9.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M3.5 12c0 3.6 2.9 6 6.5 6s6.5-2.4 6.5-6l-2.4 1.4M3.5 12l2.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </button>
  <button class="ctl on" id="follow" aria-label="Follow my position">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="10" r="3.2" fill="currentColor"/>
      <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 0v3M10 17v3M0 10h3M17 10h3" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </button>
  <button class="ctl" id="planbtn" aria-label="Voyage plan"><span class="t" style="font-size:11px">PLAN</span></button>
  <button class="ctl" id="clear" aria-label="Clear trail">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div id="banner"></div>

<div id="deck">
  <div class="inst"><div class="lbl">Speed</div><div class="val" id="sog">&ndash;&ndash;<span class="unit">kn</span></div></div>
  <div class="inst"><div class="lbl">Course</div><div class="val" id="cog">&ndash;&ndash;&ndash;&deg;</div></div>
  <div class="inst"><div class="lbl">Logged</div><div class="val" id="dist">0.0<span class="unit">nm</span></div></div>
  <div class="inst wide"><div class="val" id="latlon">no fix</div><div class="stampt" id="stamp"></div></div>
</div>

<div id="startov">
  <div class="brand">WAKE<b>//</b>SEA</div>
  <button id="startbtn">TRACK EVRIMA &mdash; SHIP AIS</button>
  <button id="startbtn2">USE PHONE GPS INSTEAD</button>
  <div class="note">ship AIS needs only wifi &middot; no GPS required</div>
</div>

<div id="sheet"></div>
<div id="keysheet">
  <div class="kbox">
    <h2>AIS FEED KEY</h2>
    <p>Live ship positions come from <a href="https://aisstream.io" target="_blank" rel="noopener">aisstream.io</a> &mdash; free. Sign in there (GitHub login works), create an API key, paste it here. Saved on this phone only; you do this once.</p>
    <input id="aiskey" type="text" placeholder="aisstream.io API key" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <button id="keysave">CONNECT</button>
      <button id="keycancel">CANCEL</button>
    </div>
  </div>
</div>
<script>
/* ================= state ================= */
const SHIP = { name: 'EVRIMA', mmsi: '215001000',
  page: 'https://www.cruisemapper.com/ships/Ritz-Carlton-Evrima-2100' };
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];
let pos = null, trail = [], totalNm = 0, follow = true, tilted = true;
let mode = null;                 // 'ship' | 'gps'
let watchId = null, shipTimer = null, ws = null, proxyIdx = 0, lastShip = null;
try {
  const s = JSON.parse(localStorage.getItem('wake-trail') || 'null');
  if (s && Array.isArray(s.pts)) { trail = s.pts; totalNm = s.nm || 0; }
} catch(e){}
function persist(){
  try { localStorage.setItem('wake-trail', JSON.stringify({pts: trail.slice(-6000), nm: totalNm})); } catch(e){}
}
function getKey(){ try { return localStorage.getItem('wake-aiskey') || ''; } catch(e){ return ''; } }

/* ================= map ================= */
const style = {
  version: 8,
  projection: { type: 'globe' },
  sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 0.35, 5, 0.35, 7, 0] },
  light: { anchor: 'map', intensity: 0.2 },
  sources: {
    sat: {
      type: 'raster', tileSize: 256, maxzoom: 18,
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution: 'Esri, Maxar, Earthstar Geographics'
    },
    labels: {
      type: 'raster', tileSize: 256, maxzoom: 10,
      tiles: ['https://basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}.png'],
      attribution: '&copy; CARTO &copy; OpenStreetMap'
    },
    trail: { type: 'geojson', data: { type:'Feature', geometry:{ type:'LineString', coordinates: [] } } }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#04070C' } },
    { id: 'sat', type: 'raster', source: 'sat',
      paint: { 'raster-saturation': -0.25, 'raster-brightness-max': 0.9 } },
    { id: 'labels', type: 'raster', source: 'labels', paint: { 'raster-opacity': 0.85 } },
    { id: 'trail-glow', type: 'line', source: 'trail',
      paint: { 'line-color': '#FFB454', 'line-width': 8, 'line-blur': 6, 'line-opacity': 0.45 },
      layout: { 'line-cap': 'round', 'line-join': 'round' } },
    { id: 'trail-core', type: 'line', source: 'trail',
      paint: { 'line-color': '#FFD9A0', 'line-width': 2.5 },
      layout: { 'line-cap': 'round', 'line-join': 'round' } }
  ]
};
const startCenter = trail.length ? [trail[trail.length-1].lon, trail[trail.length-1].lat] : [-40, 25];
const map = new maplibregl.Map({
  container: 'map', style,
  center: startCenter, zoom: trail.length ? 8 : 1.6,
  pitch: 0, attributionControl: { compact: true },
  maxPitch: 70, fadeDuration: 100
});
map.touchPitch.enable();
try { new ResizeObserver(() => map.resize()).observe(document.getElementById('map')); } catch(e){}
window.addEventListener('orientationchange', () => setTimeout(() => map.resize(), 300));
document.addEventListener('visibilitychange', () => { if (!document.hidden) map.resize(); });

const markerEl = document.createElement('div');
markerEl.className = 'shipmark';
markerEl.innerHTML = '<div class="ring"></div><div class="core"></div>' +
  '<svg class="hdg" viewBox="0 0 20 20"><path d="M10 1 L15 15 L10 11.5 L5 15 Z" fill="#4FD8FF"/></svg>';
const marker = new maplibregl.Marker({ element: markerEl, rotationAlignment: 'map' });
const hdgEl = markerEl.querySelector('.hdg');

function refreshTrail(){
  const src = map.getSource('trail');
  if (src) src.setData({ type:'Feature', geometry:{ type:'LineString',
    coordinates: trail.map(p => [p.lon, p.lat]) } });
}
map.on('load', refreshTrail);
map.on('dragstart', () => setFollow(false));
map.on('rotatestart', () => setFollow(false));

/* ================= instruments ================= */
const $ = id => document.getElementById(id);
function fmtCoord(v, pc, nc){
  const h = v >= 0 ? pc : nc, a = Math.abs(v), d = Math.floor(a);
  return d + '°' + ((a - d) * 60).toFixed(3).padStart(6,'0') + '′' + h;
}
const nmBetween = (a, b) => {
  const R = 3440.065, toR = Math.PI/180;
  const dLat=(b.lat-a.lat)*toR, dLon=(b.lon-a.lon)*toR;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
};
function updateDeck(){
  $('dist').innerHTML = totalNm.toFixed(1) + '<span class="unit">nm</span>';
  if (!pos) return;
  $('sog').innerHTML = (pos.spdKn != null ? pos.spdKn.toFixed(1) : '––') + '<span class="unit">kn</span>';
  $('cog').textContent = (pos.hdg != null ? String(Math.round(pos.hdg)).padStart(3,'0') : '–––') + '°';
  $('latlon').textContent = fmtCoord(pos.lat,'N','S') + '  ' + fmtCoord(pos.lon,'E','W');
  const ageM = Math.round((Date.now() - pos.t) / 60000);
  const age = ageM < 2 ? 'live' : (ageM < 60 ? ageM + 'm ago' : Math.floor(ageM/60) + 'h ' + (ageM%60) + 'm ago');
  $('stamp').textContent = new Date(pos.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) +
    (pos.acc ? ' ±' + Math.round(pos.acc) + 'm' : '') + ' · ' + age;
}

/* ================= shared fix pipeline ================= */
const banner = $('banner');
let firstFix = true;
function applyFix(f){
  pos = f;
  $('gpsdot').className = 'dot ok';
  $('gpstxt').textContent = f.src === 'ship' ? 'ais fix' : 'gps fix';
  $('srctxt').textContent = f.src === 'ship' ? 'AIS·' + SHIP.name : 'PHONE GPS';
  banner.classList.remove('show');

  marker.setLngLat([f.lon, f.lat]).addTo(map);
  const moving = f.hdg != null && (f.spdKn == null || f.spdKn > 0.8);
  hdgEl.style.display = moving ? 'block' : 'none';
  if (moving) marker.setRotation(f.hdg);

  const last = trail[trail.length-1];
  if (!last){
    trail.push({lat:f.lat, lon:f.lon, t:f.t}); persist();
  } else {
    const nm = nmBetween(last, f);
    if (nm > 0.01 || f.t - last.t > 60000){
      if (nm < 50) totalNm += nm;
      trail.push({lat:f.lat, lon:f.lon, t:f.t}); persist();
    }
  }
  refreshTrail();

  if (firstFix){
    firstFix = false;
    map.flyTo({ center:[f.lon,f.lat], zoom: 9.5, pitch: tilted?50:0, duration: 2600, essential:true });
  } else if (follow){
    map.easeTo({ center:[f.lon,f.lat], duration: 900 });
  }
  updateDeck();
}
function showBanner(htmlMsg){
  banner.innerHTML = htmlMsg;
  banner.classList.add('show');
}
function searching(label){
  $('gpsdot').className = 'dot wait';
  $('gpstxt').textContent = label;
}

/* ================= source: phone GPS ================= */
function onGeoFix(g){
  const c = g.coords;
  applyFix({ lat:c.latitude, lon:c.longitude, acc:c.accuracy,
    spdKn: c.speed != null ? c.speed*1.94384 : null, hdg:c.heading, t:g.timestamp, src:'gps' });
}
function onGeoErr(err){
  if (pos && mode === 'gps') return;
  $('gpsdot').className = 'dot err'; $('gpstxt').textContent = 'no fix';
  const msgs = {
    0: '<b>This browser has no GPS access.</b> Open this page in Safari or Chrome directly.',
    1: '<b>Location is blocked.</b> Settings &rarr; Privacy &amp; Security &rarr; Location Services &rarr; Safari Websites &rarr; While Using + Precise. Then reload. Or just use <a id="bship">ship AIS</a> &mdash; no GPS needed.',
    2: '<b>No GPS signal.</b> Get sky view &mdash; or switch to <a id="bship">ship AIS</a>, which needs only wifi.',
    3: '<b>GPS timed out.</b> Get sky view and <a id="bretry">retry</a>, or use <a id="bship">ship AIS</a>.'
  };
  showBanner(msgs[err.code] || msgs[2]);
  const r = $('bretry'); if (r) r.addEventListener('click', startGPSMode);
  const s = $('bship'); if (s) s.addEventListener('click', startShipMode);
}
async function startGPSMode(){
  stopSources(); mode = 'gps';
  $('startov').style.display = 'none';
  $('srctxt').textContent = 'PHONE GPS';
  searching('acquiring');
  if (!('geolocation' in navigator)) { onGeoErr({code:0}); return; }
  navigator.geolocation.getCurrentPosition(onGeoFix, onGeoErr,
    {enableHighAccuracy:true, maximumAge:10000, timeout:25000});
  watchId = navigator.geolocation.watchPosition(onGeoFix, onGeoErr,
    {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  try { await navigator.wakeLock.request('screen'); } catch(e){}
}

/* ================= source: ship AIS ================= */
function onShipPoint(lat, lon, hdgDeg, sogKn, t){
  let spd = sogKn;
  if (spd == null && lastShip && t > lastShip.t){
    const hrs = (t - lastShip.t) / 3600000;
    if (hrs > 0.005) spd = nmBetween(lastShip, {lat, lon}) / hrs;
  }
  if (!lastShip || lastShip.lat !== lat || lastShip.lon !== lon) lastShip = {lat, lon, t};
  applyFix({ lat, lon, acc:null, spdKn: spd != null ? Math.min(spd, 40) : null,
    hdg: hdgDeg, t, src:'ship' });
}

async function tryProxies(){
  for (let i = 0; i < PROXIES.length; i++){
    const p = PROXIES[(proxyIdx + i) % PROXIES.length];
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(p(SHIP.page), {cache:'no-store', signal: ctl.signal});
      clearTimeout(to);
      if (!r.ok) throw new Error('http ' + r.status);
      const text = await r.text();
      const m = text.match(/"lat":(-?[\d.]+),"lon":(-?[\d.]+)/);
      if (!m) throw new Error('no coords in page');
      const rot = text.match(/"rotation":(-?[\d.]+)/);
      const hdg = rot ? ((parseFloat(rot[1]) * 180 / Math.PI) % 360 + 360) % 360 : null;
      proxyIdx = (proxyIdx + i) % PROXIES.length;
      onShipPoint(parseFloat(m[1]), parseFloat(m[2]), hdg, null, Date.now());
      return true;
    } catch(e){ /* try next proxy */ }
  }
  return false;
}
async function tryPosJson(){
  try {
    const r = await fetch('./pos.json?ts=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    if (typeof d.lat !== 'number' || typeof d.lon !== 'number') throw new Error('bad json');
    onShipPoint(d.lat, d.lon, d.hdg, typeof d.sog === 'number' ? d.sog : null, d.t || Date.now());
    return true;
  } catch(e){ return false; }
}
async function pollShip(){
  let ok = await tryPosJson();          // reliable relay, ~5 min cadence
  if (!ok) ok = await tryProxies();     // direct scrape as backup
  if (!ok && !pos){
    $('gpsdot').className = 'dot err'; $('gpstxt').textContent = 'no feed';
    showBanner('<b>Ship feed unreachable.</b> Wifi hiccup &mdash; retrying automatically. Or <a id="bgps">use phone GPS</a>.');
    const g = $('bgps'); if (g) g.addEventListener('click', startGPSMode);
  }
}

function connectStream(key){
  try { ws = new WebSocket('wss://stream.aisstream.io/v0/stream'); } catch(e){ return; }
  ws.onopen = () => ws.send(JSON.stringify({
    APIKey: key,
    BoundingBoxes: [[[-90,-180],[90,180]]],
    FiltersShipMMSI: [SHIP.mmsi],
    FilterMessageTypes: ['PositionReport']
  }));
  ws.onmessage = ev => {
    try {
      const d = JSON.parse(ev.data);
      const p = d.Message && d.Message.PositionReport;
      if (!p) return;
      onShipPoint(p.Latitude, p.Longitude,
        p.TrueHeading != null && p.TrueHeading < 360 ? p.TrueHeading : (p.Cog < 360 ? p.Cog : null),
        p.Sog != null && p.Sog < 102 ? p.Sog : null, Date.now());
    } catch(e){}
  };
  ws.onclose = () => { ws = null; if (mode === 'ship') setTimeout(() => { if (mode === 'ship' && !ws) connectStream(key); }, 8000); };
}

async function startShipMode(){
  stopSources(); mode = 'ship';
  $('startov').style.display = 'none';
  $('srctxt').textContent = 'AIS·' + SHIP.name;
  searching('acquiring');
  pollShip();
  shipTimer = setInterval(pollShip, 75000);
  const key = getKey();
  if (key) connectStream(key);
  try { await navigator.wakeLock.request('screen'); } catch(e){}
}

function stopSources(){
  if (watchId != null){ try { navigator.geolocation.clearWatch(watchId); } catch(e){} watchId = null; }
  if (shipTimer){ clearInterval(shipTimer); shipTimer = null; }
  if (ws){ try { ws.close(); } catch(e){} ws = null; }
  pos = null; lastShip = null;
}

function fmtDelta(ms){
  const m = Math.max(0, Math.round(ms/60000));
  const d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
  return d>0 ? d+'d '+h+'h' : (h>0 ? h+'h '+mm+'m' : mm+'m');
}
function portState(p, now){
  if (p.d && now > p.d) return 'done';
  if (now >= p.a && (!p.d || now <= p.d)) return 'now';
  return 'up';
}
function renderSheet(){
  const now = Date.now();
  let nextIdx = PORTS.findIndex(p => portState(p, now) !== 'done');
  const rows = PORTS.map((p, i) => {
    const st = portState(p, now);
    const cls = st === 'done' ? 'done' : (st === 'now' ? 'now' : (i === nextIdx ? 'next' : ''));
    let when;
    const opts = {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'UTC'};
    const arrTxt = new Date(p.a).toLocaleString([], {month:'short', day:'numeric'});
    if (st === 'done') when = arrTxt + ' · sailed';
    else if (st === 'now') when = 'IN PORT' + (p.d ? ' · departs in <b>' + fmtDelta(p.d - now) + '</b>' : '');
    else when = arrTxt + ' · arriving in <b>' + fmtDelta(p.a - now) + '</b>';
    return '<div class="port ' + cls + '"><div class="pdot"></div><div>' +
      '<div class="pname">' + p.n + '</div>' +
      '<div class="pwhen">' + when + '</div>' +
      (st !== 'done' && p.plan ? '<div class="pplan">' + p.plan + '</div>' : '') +
      (st !== 'done' && p.tip  ? '<div class="ptip">'  + p.tip  + '</div>' : '') +
      '</div></div>';
  }).join('');
  $('sheet').innerHTML = '<h2>VOYAGE <span>//</span> LONDON → BARCELONA</h2>' + rows;
}

  map.addLayer({ id:'route', type:'line', source:'route',
    paint:{ 'line-color':'#4FD8FF', 'line-width':1.2, 'line-dasharray':[1,2.5], 'line-opacity':0.5 } },

    el.textContent = p.n.split(' · ')[0].toUpperCase();
    new maplibregl.Marker({ element: el, anchor:'center' }).setLngLat([p.lon, p.lat]).addTo(map);
  }
});

/* shared sailing history */
let trackLoaded = false;
async function loadTrack(){
  try {
    const r = await fetch('./track.json?ts=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    if (!Array.isArray(d.pts) || d.pts.length < 2) return;
    trail = d.pts.slice();
    totalNm = 0;
    for (let i = 1; i < trail.length; i++){
      const nm = nmBetween(trail[i-1], trail[i]);
      if (nm < 50) totalNm += nm;
    }
    trackLoaded = true;
    if (pos && pos.spdKn == null && trail.length >= 2){
      const a = trail[trail.length-2], b = trail[trail.length-1];
      const hrs = (b.t - a.t) / 3600000;
      if (hrs > 0.02 && hrs < 6) pos.spdKn = Math.min(nmBetween(a, b) / hrs, 30);
    }
    refreshTrail(); updateDeck();
  } catch(e){}
}
const _startShipMode = startShipMode;
startShipMode = async function(){
  await _startShipMode();
  loadTrack();
  if (!window.__trackTimer) window.__trackTimer = setInterval(() => { if (mode === 'ship') loadTrack(); }, 600000);
};
